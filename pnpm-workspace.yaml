packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@paystreamer/*'
  - '@paystreamer/sdk@0.1.0'
  - '@paystreamer/sdk@0.1.1'
  - '@paystreamer/sdk@0.2.0'
  - vite@8.2.0
overrides:
  '@headlessui/react': '^2.2.0'
  'react': '^19.2.3'
  'react-dom': '^19.2.3'
  '@mysten/dapp-kit-react': '2.1.10'
  '@mysten/dapp-kit-core': '1.6.8'
  '@mysten/sui': '2.23.1'
  '@types/react': '^19.2.8'
  '@types/react-dom': '^19.2.3'
