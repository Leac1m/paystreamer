name: Testnet E2E

# Runs apps/example's E2E suite against real Sui testnet — localnet E2E
# (test.yml / ci/e2e.sh) doesn't catch real indexer lag, faucet limits, or
# network quirks that only show up against a live network. See roadmap.md
# Phase 1.
on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  testnet-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright browsers
        run: cd apps/example && npx playwright install --with-deps chromium
      - name: Build SDK
        run: pnpm --filter @paystreamer/sdk build
      - name: Run E2E suite against testnet
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_IS_TEST_MODE: 'true'
          E2E_PRIVATE_KEY: ${{ secrets.TESTNET_SPONSOR_PRIVATE_KEY }}
        run: cd apps/example && pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-e2e-report
          path: apps/example/playwright-report/
          retention-days: 14
